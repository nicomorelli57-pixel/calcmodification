<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notsuspiciouslinktoacalculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Wiiiiiiide Calc</h1>
    <div class="calculator">
      <!-- Removed 'readonly' to ensure the screen accepts text input -->
      <input type="text" id="result" />
      <div class="buttons">
        <button class="clear">C</button>
        <button class="operator">/</button>
        <button class="operator">*</button>
        <button class="operator">-</button>
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">+</button>
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="equals">=</button>
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="number">0</button>
        <button class="decimal">.</button>
      </div>
    </div>
    <div>
      Links to other versions:
      <ul>
        <li><a href="Nothing to See Here">Nothing to See Here</a></li>
        <li><a href="Dont click the bottom link">Dont Click the bottom link</a></li>
        <li><a href="dont do it im telling you">Dont Do It Im Telling You</a></li>
        <li><a href="https://youtube.com">Dont Click Me!</a></li>
      </ul>
    </div>

    <!-- Embedded JavaScript directly so there are no filename errors -->
    <script>
      alert("Welcome to the Super Wide Calculator!    Dont Click the link on the bottom");
      
      const allButtonEls = document.querySelectorAll(".buttons button");
      const inputFieldEl = document.getElementById("result");

      for (let i = 0; i < allButtonEls.length; i++) {
        allButtonEls[i].addEventListener("click", () => {
          const buttonValue = allButtonEls[i].textContent;
          if (buttonValue === "C") {
            clearResult();
          } else if (buttonValue === "=") {
            calculateResult();
          } else {
            appendValue(buttonValue);
          }
        });
      }

      function clearResult() {
        inputFieldEl.value = "";
      }

      function calculateResult() {
        try {
          inputFieldEl.value = eval(inputFieldEl.value);
        } catch (err) {
          inputFieldEl.value = "Fix Yo Equation Twin"; 
        }
      }

      function appendValue(buttonValue) {
        inputFieldEl.value += buttonValue;
      }
    </script>
  </body>
</html>
